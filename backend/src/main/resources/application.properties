server.port=${SERVER_PORT:8080}

# --- Database (MySQL for development) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/support_tickets?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change_me}

# --- JPA: schema is owned by Flyway, Hibernate never touches it ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway: runs V1 (schema) and V2 (seed) automatically on startup ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JSON: reject unknown fields so PATCH cannot silently ignore e.g. "title" ---
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- CORS: comma separated list of allowed origins ---
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
